name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign_windows:
        description: 'Sign the Windows app (needs a deployment rule for this branch on the release environment)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: '--target universal-apple-darwin'
          - os: windows-latest
            platform: win
            args: ''
          - os: ubuntu-22.04
            platform: linux
            args: ''

    runs-on: ${{ matrix.os }}
    # Only the Windows build signs, and only in the `release` environment (v* tags, or a manual
    # run with sign_windows on a branch that the environment allows).
    environment: ${{ matrix.platform == 'win' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_windows) && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    env:
      SIGN_WINDOWS: ${{ matrix.platform == 'win' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_windows) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Sign in to Azure (Windows signing)
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Tauri runs the signCommand on the app exe, the NSIS plugins, uninstaller and installer,
      # and the MSI, before it zips and minisigns the updater artifacts. A signing failure fails
      # the build, so a tag never publishes an unsigned Windows app.
      - name: Set up Windows signing
        id: signing
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          ./scripts/windows-signing.ps1 -Setup
          $script = (Resolve-Path scripts/windows-signing.ps1).Path
          $config = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = 'pwsh'; args = @('-NoProfile', '-File', $script, '%1') } } } }
          $file = Join-Path $env:RUNNER_TEMP 'tauri-windows-signing.json'
          $config | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $file -Encoding utf8
          Get-Content -LiteralPath $file
          "tauri_args=--config $($file -replace '\\', '/')" >> $env:GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ steps.signing.outputs.tauri_args }}

      # Checks what ships: the installers, the files inside them (Tauri leaves
      # target/release/<app>.exe itself unsigned), and the installers inside the updater zips.
      - name: Check Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $sign = './scripts/windows-signing.ps1'
          $nsis = @(Get-ChildItem "$bundle/nsis/*-setup.exe")
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw "Expected one NSIS installer and one MSI, found $($nsis.Count) and $($msi.Count)." }
          & $sign -Verify $nsis[0].FullName, $msi[0].FullName

          # The NSIS installer's app and uninstaller (7-Zip rebuilds uninstall.exe as it was signed).
          $out = Join-Path $env:RUNNER_TEMP 'nsis-contents'
          7z x $nsis[0].FullName "-o$out" -y | Out-Null
          if ($LASTEXITCODE) { throw "7-Zip couldn't extract $($nsis[0].Name)." }
          $files = @(Get-ChildItem $out -Recurse -File -Include *.exe, *.dll |
            Where-Object { $_.FullName -notlike '*\$PLUGINSDIR\*' })
          if (-not ($files | Where-Object Name -eq 'uninstall.exe') -or -not ($files | Where-Object Name -ne 'uninstall.exe')) {
            throw "The NSIS installer should contain the app and uninstall.exe; found: $($files.Name -join ', ')"
          }
          & $sign -Verify $files.FullName

          # The MSI's app (an administrative install unpacks it without installing).
          $out = Join-Path $env:RUNNER_TEMP 'msi-contents'
          $msiexec = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$out`"")
          if ($msiexec.ExitCode) { throw "msiexec couldn't unpack $($msi[0].Name) (exit code $($msiexec.ExitCode))." }
          $files = @(Get-ChildItem $out -Recurse -File -Include *.exe, *.dll)
          if (-not $files) { throw "The MSI should contain the app." }
          & $sign -Verify $files.FullName

          # The updater zips must hold these signed installers, so the .sig covers signed files.
          foreach ($pair in @(@($nsis[0], '.nsis.zip'), @($msi[0], '.msi.zip'))) {
            $installer = $pair[0]
            $zip = Get-Item -LiteralPath ([IO.Path]::ChangeExtension($installer.FullName, $pair[1]))
            if (-not (Test-Path -LiteralPath "$($zip.FullName).sig")) { throw "$($zip.Name) has no updater signature." }
            $out = Join-Path $env:RUNNER_TEMP "updater-$($installer.Extension.TrimStart('.'))"
            Expand-Archive -LiteralPath $zip.FullName $out -Force
            $inner = Get-Item -LiteralPath (Join-Path $out $installer.Name)
            & $sign -Verify $inner.FullName
            if ((Get-FileHash -LiteralPath $inner.FullName).Hash -ne (Get-FileHash -LiteralPath $installer.FullName).Hash) {
              throw "$($zip.Name) holds a different $($installer.Name) than the signed installer."
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agent-mission-control-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/**/*.nsis.zip
            src-tauri/target/**/release/bundle/**/*.nsis.zip.sig
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz.sig
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate updater manifest (latest.json)
        env:
          MAC_SIG: ''
          WIN_SIG: ''
          LINUX_SIG: ''
          MAC_FILE: ''
          WIN_FILE: ''
          LINUX_FILE: ''
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE_URL="https://github.com/DanWahlin/agent-mission-control/releases/download/${GITHUB_REF_NAME}"

          MAC_SIG=$(find artifacts -name "*.app.tar.gz.sig" -type f -exec cat {} \; -quit 2>/dev/null || echo "")
          WIN_SIG=$(find artifacts -name "*.nsis.zip.sig" -type f -exec cat {} \; -quit 2>/dev/null || echo "")
          LINUX_SIG=$(find artifacts -name "*.AppImage.tar.gz.sig" -type f -exec cat {} \; -quit 2>/dev/null || echo "")

          MAC_FILE=$(find artifacts -name "*.app.tar.gz" ! -name "*.sig" -type f -exec basename {} \; 2>/dev/null | head -1)
          WIN_FILE=$(find artifacts -name "*.nsis.zip" ! -name "*.sig" -type f -exec basename {} \; 2>/dev/null | head -1)
          LINUX_FILE=$(find artifacts -name "*.AppImage.tar.gz" ! -name "*.sig" -type f -exec basename {} \; 2>/dev/null | head -1)

          export VERSION BASE_URL MAC_SIG WIN_SIG LINUX_SIG MAC_FILE WIN_FILE LINUX_FILE
          node -e "
            const { VERSION, BASE_URL, MAC_SIG, WIN_SIG, LINUX_SIG, MAC_FILE, WIN_FILE, LINUX_FILE } = process.env;
            const p = {};
            const enc = f => f ? encodeURI(f) : '';
            if (MAC_SIG && MAC_FILE) {
              const url = BASE_URL + '/' + enc(MAC_FILE);
              p['darwin-aarch64'] = { signature: MAC_SIG, url };
              p['darwin-x86_64'] = { signature: MAC_SIG, url };
            }
            if (LINUX_SIG && LINUX_FILE) {
              p['linux-x86_64'] = { signature: LINUX_SIG, url: BASE_URL + '/' + enc(LINUX_FILE) };
            }
            if (WIN_SIG && WIN_FILE) {
              p['windows-x86_64'] = { signature: WIN_SIG, url: BASE_URL + '/' + enc(WIN_FILE) };
            }
            const manifest = {
              version: VERSION,
              pub_date: new Date().toISOString(),
              platforms: p
            };
            require('fs').writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
            latest.json
          draft: false
          prerelease: false
          body: |
            ## 🛰️ Download Agent Mission Control

            A live, second-monitor dashboard for the GitHub Copilot CLI. Every tool call, sub-agent dispatch, and permission prompt becomes a live signal so you can spot stalls and "needs attention" the moment they happen.

            ### 🤖 Install this using the Copilot CLI

            If you have [GitHub Copilot CLI](https://github.com/features/copilot/cli/) installed, you can install Agent Mission Control with a single prompt:

            ```
            copilot --allow-all -p "Install the latest version of this app for me https://github.com/DanWahlin/agent-mission-control/releases"
            ```

            > **Note:** The Windows app is code-signed. The macOS and Linux apps are not, so after installing on those you'll still need to manually run the commands shown below for your operating system.

            Or download the installer for your OS from the **Assets** list below.

            ### 🍎 macOS
            | File | Description |
            |------|-------------|
            | `*.dmg` | macOS installer (Universal — Apple Silicon + Intel) |

            > Download the `.dmg` file from the **Assets** list below.
            >
            > **Note:** The macOS app is not code-signed. After installing, open Terminal and run:
            > ```
            > sudo xattr -rd com.apple.quarantine /Applications/Agent\ Mission\ Control.app
            > ```

            ### 🪟 Windows
            | File | Description |
            |------|-------------|
            | `*.msi` | Windows installer (x64) |
            | `*.exe` | Windows setup executable (x64) |

            > Download the `.msi` or `.exe` file from the **Assets** list below.
            >
            > **Signed:** The Windows app and installers are signed by **Dan Wahlin** (Azure Artifact Signing), so Smart App Control lets them run.
            >
            > While the new signature builds reputation, SmartScreen may still show "Windows protected your PC" for early signed releases:
            > 1. If your browser warns about the download, select **"Keep"**
            > 2. When you see "Windows protected your PC", click **"More info"** (the publisher shows as Dan Wahlin)
            > 3. Then click **"Run anyway"**

            ### 🐧 Linux
            | File | Description |
            |------|-------------|
            | `*.AppImage` | Universal Linux (run anywhere) |
            | `*.deb` | Debian/Ubuntu package |
            | `*.rpm` | Fedora/RHEL package |

            > Download the `.AppImage`, `.deb`, or `.rpm` file from the **Assets** list below.
            >
            > **Recommended:** The `.AppImage` needs no `sudo` — just make it executable and run it:
            > ```
            > chmod +x Agent.Mission.Control_*.AppImage
            > ./Agent.Mission.Control_*.AppImage
            > ```
            >
            > The `.deb`/`.rpm` packages require root to install (e.g. `sudo dpkg -i Agent.Mission.Control_*.deb`).
            >
            > **Tray icon:** If you want the system tray menu, install `libayatana-appindicator3-1` (Debian/Ubuntu) or `libappindicator-gtk3` (Fedora/RHEL). It's optional — the app launches fine without it (e.g. on WSL2, which has no tray).

            ---
            *A live mission-control dashboard for your GitHub Copilot CLI sessions — built with Tauri + Phaser + TypeScript.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}